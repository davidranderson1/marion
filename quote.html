<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marion — Quote Intake</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --yellow:#FFD400;--dark:#1a1a1a;--grey:#a7a9ac;--greylt:#e6e7e8;
  --red:#d0021b;--green:#0a8a3c;--amber:#b8860b;--ink:#1a1a1a;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Roboto Condensed',Arial,sans-serif;color:var(--ink);background:#f2f2f0;line-height:1.3;}
.mono{font-family:'JetBrains Mono',monospace;}

/* HEADER */
.top{background:var(--yellow);border-bottom:5px solid #000;padding:14px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.top .logo{width:34px;height:34px;border-radius:50%;background:#000;flex:0 0 auto;position:relative;}
.top .logo:after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--yellow));}
.top h1{font-size:24px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;}
.top h1 small{font-size:13px;font-weight:400;color:#555;letter-spacing:1px;display:block;margin-top:-3px;}
.top .phase{margin-left:auto;font-size:12px;font-weight:700;background:#000;color:var(--yellow);
  padding:5px 12px;border-radius:3px;letter-spacing:1px;}

/* AUTH */
.auth{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;}
.auth input{border:1px solid #00000055;border-radius:3px;padding:5px 8px;font-family:inherit;font-size:12px;width:190px;background:#fffdf0;}
.auth .abtn{border:none;border-radius:3px;background:#000;color:var(--yellow);font-family:inherit;font-weight:700;
  font-size:11px;letter-spacing:.5px;text-transform:uppercase;padding:6px 10px;cursor:pointer;}
.auth .abtn:hover{background:#333;}
.auth .who{color:#333;}
.auth a.staff{color:#000;text-decoration:underline;font-weight:700;}

.wrap{max-width:1280px;margin:0 auto;padding:22px;}

/* LAYOUT */
.stage{display:grid;grid-template-columns:1fr;gap:22px;}
.panel{background:#fff;border:1px solid #d4d4d2;border-radius:5px;overflow:hidden;}
.panel-h{background:var(--ink);color:#fff;padding:10px 16px;font-weight:700;font-size:14px;
  letter-spacing:1px;text-transform:uppercase;display:flex;align-items:center;gap:10px;}
.panel-h .step{background:var(--yellow);color:#000;width:22px;height:22px;border-radius:3px;
  display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex:0 0 auto;}
.panel-h .sub{margin-left:auto;font-weight:400;font-size:11px;color:var(--grey);letter-spacing:.5px;text-transform:none;}
.panel-b{padding:16px;}
